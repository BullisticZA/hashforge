<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HashForge: Mining Tycoon</title>
  <meta name="description" content="Build GPU and ASIC mining rigs, survive load-shedding, pay the power bill and grow a hashrate empire.">
  <link rel="icon" href="assets/icon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="app">
    <header id="hud"></header>
    <nav id="nav"></nav>
    <main id="main"></main>
    <aside id="side"></aside>
  </div>
  <div id="overlay" hidden>
    <div class="overlay-card">
      <div class="overlay-head"><h2 id="overlay-title"></h2><button class="icon-btn" data-action="close-overlay" aria-label="Close">✕</button></div>
      <div class="overlay-body">
        <div id="stage3d"></div>
        <div id="overlay-panel"></div>
      </div>
    </div>
  </div>
  <div id="toasts"></div>
  <noscript>HashForge needs JavaScript and WebGL.</noscript>
  <script type="module" src="js/main.js"></script>
  <script>
    // Opened straight from disk: browsers block module scripts on file://, so explain how to start it properly
    if (location.protocol === 'file:') {
      document.getElementById('main').innerHTML =
        '<div class="card" style="max-width:560px;margin:40px auto">' +
        '<h3>Start HashForge with the launcher</h3>' +
        '<p>Your browser blocks the game when <b>index.html</b> is opened straight from a folder.</p>' +
        '<p>Close this tab and double-click <b>Play HashForge.bat</b> in the same folder. ' +
        'The game opens at <b>http://localhost:8765</b>. Keep the small black window open while you play.</p>' +
        '<p class="muted small">Or play online once GitHub Pages is on: bullisticza.github.io/hashforge</p></div>';
    }
  </script>
</body>
</html>
